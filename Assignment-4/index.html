<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Secure Connect - Real-Time Chat</title>
  <style>
    body { font-family: monospace; background: #121212; color: #e0e0e0; padding: 2rem; }
    #messages { border: 1px solid #333; height: 250px; overflow-y: auto; padding: 1rem; margin-bottom: 1rem; }
    input, button { padding: 0.5rem; background: #1e1e1e; color: #fff; border: 1px solid #444; }
  </style>
</head>
<body>
  <h2>Secure Connect — Socket.IO Chat</h2>
  <div id="messages"></div>
  <input id="username" placeholder="Username (e.g. Aditi)" value="Aditi" />
  <input id="room" placeholder="Room" value="general" />
  <input id="msg" placeholder="Type a message..." />
  <button onclick="sendMessage()">Send</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const messagesDiv = document.getElementById('messages');

    socket.on('message', (data) => {
      const p = document.createElement('p');
      p.textContent = `[${data.room}] ${data.username}: ${data.message}`;
      messagesDiv.appendChild(p);
    });

    function sendMessage() {
      const username = document.getElementById('username').value;
      const room = document.getElementById('room').value;
      const msgInput = document.getElementById('msg');
      if (!msgInput.value.trim()) return;

      socket.emit('chatMessage', { room, username, message: msgInput.value });
      msgInput.value = '';
    }
  </script>
</body>
</html>
